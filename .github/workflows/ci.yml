name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: pip install -r requirements-dev.txt
      # includes tests/test_parity.py: web/core.js must compute what focus/ computes
      - run: python -m pytest -q
      - run: node --check web/app.js && node --check web/core.js
